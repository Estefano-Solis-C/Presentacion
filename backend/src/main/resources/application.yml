server:
  port: ${PORT:8080}
  compression:
    enabled: true
    mime-types: application/json,text/html,text/xml,text/plain,application/javascript,text/css
    min-response-size: 1024
  tomcat:
    threads:
      max: 200
      min-spare: 10

spring:
  application:
    name: dora-mayer-portal-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:prod}

  # ============================================================================
  # JAVA 21 VIRTUAL THREADS (PROJECT LOOM)
  # Allows handling 2,000+ concurrent blocking requests with minimal RAM footprint
  # ============================================================================
  threads:
    virtual:
      enabled: true

  # ============================================================================
  # TIDB SERVERLESS DATASOURCE (MYSQL COMPATIBLE)
  # Strict HikariCP pool parameters to prevent connection starvation on TiDB
  # ============================================================================
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://${TIDB_HOST:gateway01.us-east-1.prod.aws.tidbcloud.com}:${TIDB_PORT:4000}/${TIDB_DATABASE:doramayer}?${TIDB_PARAMS:sslMode=VERIFY_IDENTITY&useSSL=true&allowPublicKeyRetrieval=true&serverTimezone=America/Lima}}
    username: ${TIDB_USER:root}
    password: ${TIDB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: DoraMayerTiDBPool
      maximum-pool-size: 5
      minimum-idle: 1
      idle-timeout: 30000
      max-lifetime: 900000
      connection-timeout: 10000
      leak-detection-threshold: 20000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        jdbc:
          batch_size: 25
          time_zone: America/Lima
    show-sql: false

  # ============================================================================
  # CAFFEINE CACHE MANAGER
  # In-memory RAM caching for ultra-fast response (<1ms) under heavy load
  # ============================================================================
  cache:
    type: caffeine
    cache-names:
      - eventosCache
      - nivelesCache
      - talleresCache
      - statsCache
    caffeine:
      spec: maximumSize=500,expireAfterWrite=600s

# ==============================================================================
# ACTUATOR & HEALTH MONITORING
# ==============================================================================
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

