<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F296B" />
      <stop offset="60%" stop-color="#16388A" />
      <stop offset="100%" stop-color="#0A1D4E" />
    </linearGradient>
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1" fill="#FFFFFF" opacity="0.08" />
    </pattern>
  </defs>

  <!-- Fondo Azul Institucional -->
  <rect width="800" height="450" fill="url(#bgGrad)" />
  <rect width="800" height="450" fill="url(#gridPattern)" />

  <!-- Marco Editorial Dorado -->
  <rect x="24" y="24" width="752" height="402" rx="8" fill="none" stroke="#FBB600" stroke-width="2" stroke-opacity="0.4" />
  <rect x="30" y="30" width="740" height="390" rx="6" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.1" />

  <!-- Escudo / Corona Central -->
  <g transform="translate(400, 185)">
    <!-- Círculo Dorado Resplandor -->
    <circle cx="0" cy="0" r="64" fill="#0F296B" stroke="#FBB600" stroke-width="3" />
    <circle cx="0" cy="0" r="54" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.2" />

    <!-- Libro Abierto y Antorcha de Estudio, Trabajo y Amistad -->
    <path d="M-28,8 C-28,8 -14,-2 0,4 C14,-2 28,8 28,8 L28,26 C28,26 14,16 0,22 C-14,16 -28,26 -28,26 Z" fill="#FBB600" fill-opacity="0.9" />
    <path d="M0,4 L0,22" stroke="#0F296B" stroke-width="2" stroke-linecap="round" />
    
    <!-- Llama del Saber -->
    <path d="M0,-24 C-8,-12 -4,-4 0,-4 C4,-4 8,-12 0,-24 Z" fill="#FBB600" />
    <path d="M0,-16 C-4,-8 -2,-4 0,-4 C2,-4 4,-8 0,-16 Z" fill="#FFFFFF" />

    <!-- Hojas de Laurel Cívicas -->
    <path d="M-40,-12 C-46,6 -38,24 -24,34 M40,-12 C46,6 38,24 24,34" fill="none" stroke="#FBB600" stroke-width="2" stroke-linecap="round" stroke-dasharray="2 4" />
  </g>

  <!-- Tipografía Institucional -->
  <text x="400" y="285" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="bold" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">
    I.E.P. DORA MAYER DE ZULEN
  </text>
  <text x="400" y="312" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#FBB600" text-anchor="middle" letter-spacing="2">
    ARCHIVO INSTITUCIONAL · RÍMAC
  </text>
  <text x="400" y="335" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#FFFFFF" fill-opacity="0.6" text-anchor="middle">
    Fundado en 1957 — Estudio, Trabajo y Amistad
  </text>
</svg>
